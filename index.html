<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOKEL BTY V20.1 FIXED</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial}
.light{background:#f0f2f5;color:#111}.dark{background:#0f172a;color:#eee}
.header{background:linear-gradient(90deg,#000,#c00,#ffcc00);color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99;font-weight:900}
.tabs{display:flex;gap:3px;background:#fff;padding:5px;position:sticky;top:46px;z-index:50;overflow-x:auto}
.tab{flex:1;min-width:45px;padding:7px 2px;border-radius:8px;text-align:center;font-weight:bold;cursor:pointer;font-size:11px;background:#eee}
.tab.active{background:#000;color:#ffcc00;border:2px solid #ffcc00}
.card{background:#fff;border-radius:12px;padding:10px;margin:7px 0;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.dark.card{background:#1e293b}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin:4px 0}
button{border:none;border-radius:9px;padding:8px 10px;font-weight:bold;cursor:pointer}
.btn-bty{background:#000;color:#ffcc00}.btn-blue{background:#1877f2;color:#fff}.btn-red{background:#c00;color:#fff}.btn-green{background:#00a400;color:#fff}.btn-gold{background:#ffcc00;color:#000}.btn-gray{background:#ddd;color:#111}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid #ffcc00;background:#ddd;object-fit:cover}
.post-img{width:100%;border-radius:10px;margin-top:5px}
.small{font-size:11px;opacity:.7}.badge{background:#ffcc00;color:#000;padding:2px 6px;border-radius:6px;font-size:9px;font-weight:900}.price{color:#00a400;font-weight:900}
.promoted{border:2px solid #ffcc00;box-shadow:0 0 10px #ffcc00}
.bell{position:relative;background:#fff;color:#000;padding:5px 9px;border-radius:12px;font-weight:900}.bell-count{position:absolute;top:-4px;right:-4px;background:#c00;color:#fff;border-radius:50%;width:14px;height:14px;font-size:9px;display:flex;align-items:center;justify-content:center}
.stat{background:#111;color:#ffcc00;padding:10px;border-radius:8px;text-align:center;font-weight:900;font-size:12px}
.leader{display:flex;gap:6px;align-items:center;padding:6px;border-radius:8px;background:#ffcc00;color:#000;margin:4px 0;font-weight:900}
.chat-box{height:250px;overflow-y:auto;border:1px solid #ddd;border-radius:8px;padding:5px}.msg{margin:4px 0;padding:5px 8px;border-radius:10px;max-width:75%;font-size:13px}.me{background:#1877f2;color:#fff;margin-left:auto}.other{background:#eee;color:#111}
</style>
</head>
<body class="light">
<div class="header">
<span>YOKEL BTY 🇵🇬 V20.1 FIXED <span id="bal" style="background:#00a400;color:#fff;padding:2px 6px;border-radius:6px">K0</span></span>
<div style="display:flex;gap:4px"><div class="bell" onclick="toggleNotifs()">🔔<span id="bellCount" class="bell-count" style="display:none">0</span></div><button class="btn-gray" onclick="location.reload()">↻</button><button class="btn-gray" onclick="logout()">Out</button></div>
</div>

<div style="max-width:680px;margin:auto">
<div id="loginBox" class="card"></div>
<div id="app" style="display:none">
<div class="tabs card" style="margin:5px">
<div id="tab-feed" class="tab active" onclick="showTab('feed')">🏠</div>
<div id="tab-market" class="tab" onclick="showTab('market')">🛒</div>
<div id="tab-leader" class="tab" onclick="showTab('leader')">🏆</div>
<div id="tab-users" class="tab" onclick="showTab('users')">👥</div>
<div id="tab-chat" class="tab" onclick="showTab('chat')">💬</div>
<div id="tab-profile" class="tab" onclick="showTab('profile')">👤</div>
<div id="tab-admin" class="tab" style="display:none" onclick="showTab('admin')">👑</div>
</div>

<div id="view-feed" style="padding:0 7px">
<div class="card" style="display:flex;gap:7px;align-items:center"><img id="myAv" class="avatar"><div><b id="hello"></b> <span id="myBal" class="badge" style="background:#00a400;color:#fff">K0</span><div class="small" id="online"></div></div><input type="file" id="avInput" accept="image/*" style="display:none"><button class="btn-gray" style="margin-left:auto" onclick="document.getElementById('avInput').click()">📸</button></div>
<div class="card"><textarea id="txt" placeholder="Wanem niupela?"></textarea><div style="display:flex;gap:4px"><input type="file" id="postFile" accept="image/*" style="flex:1"></div><div style="display:flex;gap:4px"><input id="price" type="number" placeholder="Price K" style="flex:1"><select id="postType" style="flex:1"><option value="post">Normal</option><option value="market">🛒 Market</option><option value="ad">🔥 Ad K10</option></select></div><img id="preview" style="display:none;width:100%;border-radius:8px;margin-top:5px"><div style="display:flex;gap:5px;margin-top:7px"><button class="btn-bty" style="flex:1" id="postBtn" onclick="makePost()">Postim 🚀</button><button class="btn-gray" onclick="clearPreview()">Clear</button></div><div id="status" class="small"></div></div>
<input id="search" placeholder="🔍 Search..." oninput="doSearch()" style="margin:0 7px;width:calc(100% - 14px)">
<div id="feed"></div>
</div>

<div id="view-market" style="display:none;padding:0 7px"><div class="card"><h3>🛒 Market</h3><div id="marketFeed"></div></div></div>
<div id="view-leader" style="display:none;padding:0 7px"><div class="card"><h3>🏆 Rich Board</h3><div id="leaderBoard"></div><button class="btn-gold" style="width:100%;margin-top:8px" onclick="claimDaily()">🎁 Daily K5</button><div class="small" id="dailyInfo"></div></div></div>
<div id="view-users" style="display:none;padding:0 7px"><div class="card"><h3>👥 People</h3><div id="usersList"></div></div></div>
<div id="view-chat" style="display:none;padding:0 7px"><div class="card"><h3>💬 Chat</h3><select id="chatTo"></select><button class="btn-blue" style="width:100%;margin-top:4px" onclick="loadChat()">Open</button><div id="chatBox" class="chat-box" style="margin-top:7px"></div><div style="display:flex;gap:4px;margin-top:5px"><input id="chatMsg" placeholder="Msg..."><button class="btn-blue" onclick="sendChat()">Send</button></div></div></div>
<div id="view-profile" style="display:none;padding:0 7px"><div class="card" style="text-align:center"><img id="profAv" class="avatar" style="width:80px;height:80px"><h2 id="profName"></h2><div class="small" id="profStats"></div><textarea id="bio" placeholder="Bio..."></textarea><button class="btn-bty" style="width:100%;margin-top:5px" onclick="saveBio()">Save</button></div><div id="myPosts"></div></div>
<div id="view-admin" style="display:none;padding:0 7px"><div class="card"><h2>👑 ADMIN</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div class="stat"><div id="aUsers">0</div>Users</div><div class="stat"><div id="aPosts">0</div>Posts</div><div class="stat"><div id="aMarket">0</div>Market</div><div class="stat"><div id="aAds">0</div>Ads</div></div><div style="margin-top:10px"><input id="banInput" placeholder="Name to ban"><button class="btn-red" onclick="banUser()">BAN</button></div><div id="adminPosts" style="margin-top:10px"></div><button class="btn-gold" style="width:100%;margin-top:8px" onclick="giveAll()">Give K50 All</button></div></div>

</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyA7JJpeSfV-pY-XCtsdXLvITFQmAvZ8pKo",authDomain:"yokelbook-global.firebaseapp.com",projectId:"yokelbook-global",storageBucket:"yokelbook-global.firebasestorage.app",messagingSenderId:"1048288092483",appId:"1:1048288092483:web:0f6eb6073dfc94b0d3cff6"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let user=localStorage.getItem('yb_user')||'',avatars=JSON.parse(localStorage.getItem('yb_av')||'{}'),bios=JSON.parse(localStorage.getItem('yb_bio')||'{}'),balances=JSON.parse(localStorage.getItem('yb_bal')||'{}'),banned=JSON.parse(localStorage.getItem('yb_banned')||'[]'),streak=parseInt(localStorage.getItem('yb_streak')||'0'),lastDaily=localStorage.getItem('yb_lastDaily')||'',postImg='',posting=false,currentChatTo='',allPosts=[],allUsers=[];
if(!balances[user]){balances[user]=100;localStorage.setItem('yb_bal',JSON.stringify(balances));}
function showTab(t){['feed','market','leader','users','chat','profile','admin'].forEach(x=>{let v=document.getElementById('view-'+x);if(v)v.style.display=x==t?'block':'none';let tab=document.getElementById('tab-'+x);if(tab)tab.classList.toggle('active',x==t);});if(t=='profile')renderProfile();if(t=='admin')renderAdmin();if(t=='leader')renderLeader();}
function toggleNotifs(){alert('Notifs: '+ (JSON.parse(localStorage.getItem('yb_notif')||'[]').length) + ' items');}
function renderLogin(){document.getElementById('loginBox').innerHTML='<h2>YOKEL BTY V20.1 FIXED</h2><input id=u placeholder=Nem><button class=btn-bty style="width:100%;padding:12px;margin-top:7px" onclick="login()">Join 🚀</button>';}
function login(){let v=document.getElementById('u').value.trim();if(!v)return;if(banned.includes(v.toLowerCase()))return alert('Banned!');localStorage.setItem('yb_user',v);location.reload();}function logout(){localStorage.removeItem('yb_user');location.reload();}
function compress(f,max,q,cb){let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',q));};img.src=e.target.result;};r.readAsDataURL(f);}
document.getElementById('avInput').addEventListener('change',e=>{if(!e.target.files[0])return;compress(e.target.files[0],200,0.4,d=>{avatars[user]=d;localStorage.setItem('yb_av',JSON.stringify(avatars));document.getElementById('myAv').src=d;});});
document.getElementById('postFile').addEventListener('change',e=>{if(!e.target.files[0])return;document.getElementById('status').innerText='Compress...';compress(e.target.files[0],700,0.55,d=>{postImg=d;document.getElementById('preview').src=d;document.getElementById('preview').style.display='block';document.getElementById('status').innerText='Ready';});});
function clearPreview(){postImg='';document.getElementById('preview').style.display='none';document.getElementById('postFile').value='';document.getElementById('price').value='';}
async function makePost(){if(posting)return;let t=document.getElementById('txt').value.trim();let pr=document.getElementById('price').value.trim();let ty=document.getElementById('postType').value;if(!t&&!postImg)return alert('Write!');if(ty=='ad'&&(balances[user]||0)<10)return alert('Need K10');posting=true;document.getElementById('postBtn').innerText='Posting...';if(ty=='ad'){balances[user]-=10;localStorage.setItem('yb_bal',JSON.stringify(balances));}await db.collection('posts').add({user,txt:t,img:postImg||'',price:pr,type:ty,time:Date.now(),timeStr:new Date().toLocaleString(),likes:0,likedBy:[],comments:[],isAd:ty=='ad'});document.getElementById('txt').value='';clearPreview();posting=false;document.getElementById('postBtn').innerText='Postim 🚀';}
async function likePost(id,lb,likes){let ref=db.collection('posts').doc(id);if((lb||[]).includes(user))await ref.update({likedBy:firebase.firestore.FieldValue.arrayRemove(user),likes:likes-1});else await ref.update({likedBy:firebase.firestore.FieldValue.arrayUnion(user),likes:likes+1});}
async function addComment(id){let inp=document.getElementById('c-'+id);let v=inp.value.trim();if(!v)return;await db.collection('posts').doc(id).update({comments:firebase.firestore.FieldValue.arrayUnion({user,text:v})});inp.value='';}
async function delPost(id){if(confirm('Delete?'))await db.collection('posts').doc(id).delete();}
async function adminDel(id){if(confirm('ADMIN DELETE?'))await db.collection('posts').doc(id).delete();}
async function followUser(t){await db.collection('follows').add({from:user,to:t,time:Date.now()});}
async function sendMoney(to){let amt=prompt('K to send to '+to+'? You have K'+(balances[user]||0));if(!amt)return;amt=parseInt(amt);if(amt>(balances[user]||0))return alert('Not enough!');balances[user]-=amt;balances[to]=(balances[to]||0)+amt;localStorage.setItem('yb_bal',JSON.stringify(balances));document.getElementById('myBal').innerText='K'+balances[user];document.getElementById('bal').innerText='K'+balances[user];renderLeader();}
function giveAll(){if(!user.toLowerCase().includes('yokel'))return alert('Only Founder!');allUsers.forEach(u=>{balances[u]=(balances[u]||0)+50;});localStorage.setItem('yb_bal',JSON.stringify(balances));alert('Gave K50!');}
function banUser(){let n=document.getElementById('banInput').value.trim().toLowerCase();if(!n)return;if(!user.toLowerCase().includes('yokel'))return alert('Only Founder!');banned.push(n);localStorage.setItem('yb_banned',JSON.stringify(banned));document.getElementById('banInput').value='';renderAdmin();alert('Banned '+n);}
function claimDaily(){let today=new Date().toDateString();if(lastDaily==today)return alert('Already claimed!');balances[user]=(balances[user]||0)+5;streak++;localStorage.setItem('yb_bal',JSON.stringify(balances));localStorage.setItem('yb_streak',streak);localStorage.setItem('yb_lastDaily',today);lastDaily=today;document.getElementById('myBal').innerText='K'+balances[user];document.getElementById('bal').innerText='K'+balances[user];alert('K5 added! Streak '+streak);renderLeader();}
function loadUsersFromPosts(posts){let s=new Set();posts.forEach(p=>s.add(p.user));allUsers=Array.from(s);let sel=document.getElementById('chatTo');sel.innerHTML='<option>Select...</option>'+allUsers.filter(u=>u!=user).map(u=>'<option value="'+u+'">'+u+'</option>').join('');document.getElementById('usersList').innerHTML=allUsers.map(u=>{let av=avatars[u]||'';let bio=bios[u]||'';let b=balances[u]||0;return '<div class=card style="display:flex;gap:7px;align-items:center"><img class=avatar src="'+av+'"><div style="flex:1"><b>'+u+'</b> '+(u.toLowerCase().includes('yokel')?'<span class=badge>FOUNDER</span>':'')+' <span class=badge style="background:#00a400;color:#fff">K'+b+'</span><div class=small>'+bio+'</div></div><button class=btn-gold onclick="sendMoney(\''+u+'\')">💰</button><button class=btn-blue onclick="startChat(\''+u+'\')">Chat</button></div>';}).join('');if(user.toLowerCase().includes('yokel'))document.getElementById('tab-admin').style.display='block';}
function startChat(u){showTab('chat');document.getElementById('chatTo').value=u;loadChat();}
let chatUnsub=null;function loadChat(){let to=document.getElementById('chatTo').value;if(!to||to.includes('Select'))return;currentChatTo=to;if(chatUnsub)chatUnsub();let id=[user,to].sort().join('_');chatUnsub=db.collection('chats').doc(id).collection('messages').orderBy('time').onSnapshot(snap=>{let h='';snap.forEach(d=>{let m=d.data();h+='<div class="msg '+(m.from==user?'me':'other')+'"><b>'+m.from+':</b> '+m.text+'</div>';});document.getElementById('chatBox').innerHTML=h||'<div class=small>No msg</div>';document.getElementById('chatBox').scrollTop=99999;});}
async function sendChat(){let t=document.getElementById('chatMsg').value.trim();if(!t||!currentChatTo)return;let id=[user,currentChatTo].sort().join('_');await db.collection('chats').doc(id).collection('messages').add({from:user,to:currentChatTo,text:t,time:Date.now()});document.getElementById('chatMsg').value='';}
function saveBio(){bios[user]=document.getElementById('bio').value.trim();localStorage.setItem('yb_bio',JSON.stringify(bios));}
function renderProfile(){document.getElementById('profName').innerText=user;document.getElementById('profAv').src=avatars[user]||'';document.getElementById('bio').value=bios[user]||'';let my=allPosts.filter(p=>p.user==user);document.getElementById('profStats').innerText=my.length+' posts • K'+(balances[user]||0);document.getElementById('myPosts').innerHTML=my.map(p=>'<div class=card '+(p.isAd?'style="border:2px solid #ffcc00"':'')+'><div class=small>'+p.timeStr+(p.price?' • K'+p.price:'')+'</div><p>'+(p.txt||'')+'</p>'+(p.img?'<img class=post-img src="'+p.img+'">':'')+'</div>').join('');}
function renderAdmin(){document.getElementById('aUsers').innerText=allUsers.length;document.getElementById('aPosts').innerText=allPosts.length;document.getElementById('aMarket').innerText=allPosts.filter(p=>p.type=='market').length;document.getElementById('aAds').innerText=allPosts.filter(p=>p.isAd).length;document.getElementById('adminPosts').innerHTML=allPosts.map(p=>'<div class=card style="display:flex;gap:5px;align-items:center"><div style="flex:1"><b>'+p.user+'</b>: '+(p.txt||'').slice(0,38)+' '+(p.price?'K'+p.price:'')+'</div><button class=btn-red onclick="adminDel(\''+p.id+'\')">Del</button></div>').join('');}
function renderLeader(){let sorted=Object.entries(balances).sort((a,b)=>b[1]-a[1]);document.getElementById('leaderBoard').innerHTML=sorted.map(([u,k],i)=>'<div class=leader><span>'+(i+1)+'</span><b>'+u+'</b><span style="margin-left:auto">K'+k+'</span></div>').join('')||'<div class=small>No users</div>';document.getElementById('dailyInfo').innerText='Streak: '+streak+' days';}
function doSearch(){let q=document.getElementById('search').value.toLowerCase();if(!q){listen();return;}let f=allPosts.filter(p=>p.txt.toLowerCase().includes(q)||p.user.toLowerCase().includes(q));document.getElementById('feed').innerHTML=f.map(p=>{let av=avatars[p.user]||'';return '<div class=card><div style="display:flex;gap:7px"><img class=avatar src="'+av+'"><b>'+p.user+'</b></div><p>'+p.txt+'</p>'+(p.img?'<img class=post-img src="'+p.img+'">':'')+'</div>';}).join('');}
function listen(){db.collection('posts').orderBy('time','desc').onSnapshot(snap=>{let posts=[];snap.forEach(d=>posts.push({id:d.id,...d.data()}));allPosts=posts.sort((a,b)=>{if(a.isAd&&!b.isAd)return -1;if(!a.isAd&&b.isAd)return 1;return b.time-a.time;});document.getElementById('online').innerText=posts.length+' posts • FIXED • '+allUsers.length+' users';loadUsersFromPosts(posts);let html='',mHtml='';posts.forEach(p=>{let av=avatars[p.user]||'';let lb=p.likedBy||[];let cm=p.comments||[];let card='<div class="card '+(p.isAd?'promoted':'')+'"><div style="display:flex;gap:7px;align-items:center"><img class=avatar src="'+av+'"><div><b>'+p.user+'</b> '+(p.user.toLowerCase().includes('yokel')?'<span class=badge>FOUNDER</span>':'')+'<div class=small>'+(p.timeStr||'')+(p.price?' • <span class=price>K'+p.price+'</span>':'')+'</div></div></div>'+(p.txt?'<p>'+p.txt+'</p>':'')+(p.img?'<img class=post-img src="'+p.img+'">':'')+'<div style="display:flex;gap:4px;margin-top:7px;flex-wrap:wrap"><button class=btn-gray onclick="likePost(\''+p.id+'\','+JSON.stringify(lb).replace(/"/g,'&quot;')+','+(p.likes||0)+')">❤️ '+(p.likes||0)+'</button><button class=btn-gray>💬 '+cm.length+'</button><button class=btn-blue onclick="startChat(\''+p.user+'\')">Chat</button>'+(p.user==user?'<button class=btn-red onclick="delPost(\''+p.id+'\')">Del</button>':'')+'</div><div style="margin-top:4px">'+cm.map(c=>'<div class=small><b>'+c.user+':</b> '+c.text+'</div>').join('')+'</div><div style="display:flex;gap:4px;margin-top:5px"><input id="c-'+p.id+'" placeholder=Comment><button class=btn-blue onclick="addComment(\''+p.id+'\')">Send</button></div></div>';html+=card;if(p.type=='market'||p.price)mHtml+=card;});document.getElementById('feed').innerHTML=html||'<div class=card>Be first!</div>';document.getElementById('marketFeed').innerHTML=mHtml||'<div class=small>No market yet</div>';});}
if(!user)renderLogin();else{loginBox.style.display='none';app.style.display='block';hello.innerText=user;myAv.src=avatars[user]||'';myBal.innerText='K'+(balances[user]||100);bal.innerText='K'+(balances[user]||100);listen();if(user.toLowerCase().includes('yokel'))document.getElementById('tab-admin').style.display='block';}
</script>
</body>
</html>
