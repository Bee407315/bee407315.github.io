<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOKEL BTY V18 ULTIMATE</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;transition:.2s}
.light{background:#f0f2f5;color:#111}.dark{background:#0f172a;color:#eee}
.header{background:linear-gradient(90deg,#000,#c00,#ffcc00);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;font-weight:900}
.tabs{display:flex;gap:5px;background:var(--c);padding:8px;position:sticky;top:52px;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.tab{flex:1;padding:10px;border-radius:12px;text-align:center;font-weight:bold;cursor:pointer;font-size:13px}
.tab.active{background:linear-gradient(90deg,#000,#d32f2f);color:#fff;border:2px solid #ffcc00;box-shadow:0 0 12px #ffcc00}
.card{background:var(--c);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.light{--c:#fff}.dark{--c:#1e293b;--cb:#334155}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;margin:6px 0;font-size:15px}
button{border:none;border-radius:12px;padding:10px 14px;font-weight:bold;cursor:pointer}
.btn-bty{background:linear-gradient(90deg,#000,#d32f2f);color:#fff}.btn-blue{background:#1877f2;color:#fff}.btn-red{background:#c00;color:#fff}.btn-green{background:#00a400;color:#fff}.btn-gray{background:#e4e6eb;color:#111}.dark.btn-gray{background:#334155;color:#eee}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #ffcc00;background:#ddd}
.post-img,.post-vid{width:100%;border-radius:14px;margin-top:8px;max-height:540px}
.small{font-size:12px;opacity:.7}.live{background:#000;color:#0f0;padding:4px 10px;border-radius:20px;font-size:11px}.badge{background:#ffcc00;color:#000;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:900}.verify{color:#1877f2;font-size:14px}
.stories{display:flex;gap:10px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.story{flex:0 0 68px;text-align:center;cursor:pointer}.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);display:flex;align-items:center;justify-content:center}
.story-ring img{width:58px;height:58px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.notif-panel{position:fixed;top:56px;right:8px;width:320px;max-height:420px;overflow:auto;background:var(--c);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:200;display:none;padding:10px;border:2px solid #ffcc00}
.bell{position:relative;background:#fff;color:#000;padding:8px 12px;border-radius:20px;cursor:pointer;font-weight:900}
.bell-count{position:absolute;top:-6px;right:-6px;background:#c00;color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}
.chat-box{height:320px;overflow-y:auto;border:1px solid #ddd;border-radius:12px;padding:8px}
.msg{margin:6px 0;padding:8px 12px;border-radius:14px;max-width:78%}.me{background:#1877f2;color:#fff;margin-left:auto}.other{background:#e4e6eb;color:#111}.dark.other{background:#334155;color:#eee}
.live-dot{width:10px;height:10px;background:#c00;border-radius:50%;display:inline-block;animation:pulse 1s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.price{color:#00a400;font-weight:900;font-size:18px}
</style>
</head>
<body class="light">
<div class="header">
<span>YOKEL BTY 🇵🇬 <span class="badge">V18 ULTIMATE</span> <span class="live">● LIVE</span> <span id="liveNow" style="display:none"><span class="live-dot"></span> LIVE NOW</span></span>
<div style="display:flex;gap:6px;align-items:center">
<div class="bell" onclick="toggleNotifs()">🔔<span id="bellCount" class="bell-count" style="display:none">0</span></div>
<button class="btn-gray" onclick="toggleMode()">🌙</button>
<button class="btn-gray" onclick="goLive()">🔴 Go Live</button>
<button class="btn-gray" onclick="logout()">Out</button>
</div>
</div>

<div id="notifPanel" class="notif-panel card"><h3>🔔 Notifications 💎</h3><div id="notifList" class="small">No notifications yet</div><button class="btn-gray" style="width:100%;margin-top:8px" onclick="clearNotifs()">Clear All</button></div>
<div id="livePanel" style="display:none;position:fixed;top:60px;left:0;right:0;z-index:150;background:#000;padding:10px;text-align:center"><video id="liveVideo" autoplay muted style="width:100%;max-width:500px;border-radius:16px"></video><div style="margin-top:8px"><button class="btn-red" onclick="stopLive()">⏹️ End Live</button> <span class="small" style="color:#fff">Live streaming to all users! 🔴</span></div></div>

<div style="max-width:680px;margin:auto">
<div id="loginBox" class="card"></div>
<div id="app" style="display:none">

<div class="tabs card" style="margin:8px 10px">
<div id="tab-feed" class="tab active" onclick="showTab('feed')">🏠 Feed</div>
<div id="tab-market" class="tab" onclick="showTab('market')">🛒 Market</div>
<div id="tab-users" class="tab" onclick="showTab('users')">👥</div>
<div id="tab-chat" class="tab" onclick="showTab('chat')">💬</div>
<div id="tab-profile" class="tab" onclick="showTab('profile')">👤</div>
</div>

<!-- FEED -->
<div id="view-feed" style="padding:0 10px">
<div class="card"><div class="stories" id="storiesBar"></div><input type="file" id="storyFile" accept="image/*" style="display:none"></div>
<div class="card" style="display:flex;gap:10px;align-items:center"><img id="myAv" class="avatar"><div><b id="hello"></b> <span class="verify">✔️</span><div class="small" id="online"></div></div><input type="file" id="avInput" accept="image/*" style="display:none"><button class="btn-gray" style="margin-left:auto" onclick="avInput.click()">📸</button></div>
<div class="card"><textarea id="txt" placeholder="Wanem niupela? Text, photo, video, market item..."></textarea><div style="display:flex;gap:6px"><input type="file" id="postFile" accept="image/*" style="flex:1"><input type="file" id="postVideo" accept="video/*" style="flex:1"></div><div style="display:flex;gap:6px;margin-top:6px"><input id="price" type="number" placeholder="Price K (for market)" style="flex:1"><select id="postType" style="flex:1"><option value="post">Normal Post</option><option value="market">🛒 Sell in Market</option></select></div><img id="preview" style="display:none;width:100%;border-radius:12px;margin-top:8px"><video id="previewVid" controls style="display:none;width:100%;border-radius:12px;margin-top:8px"></video><div style="display:flex;gap:8px;margin-top:10px"><button class="btn-bty" style="flex:1" id="postBtn" onclick="makePost()">Postim 🚀</button><button class="btn-gray" onclick="clearPreview()">Clear</button></div><div id="status" class="small"></div></div>
<div id="feed"></div>
</div>

<!-- MARKET -->
<div id="view-market" style="display:none;padding:0 10px"><div class="card"><h3>🛒 PNG Marketplace — Buai, Phone, Kain2</h3><div id="marketFeed"></div></div></div>

<!-- USERS -->
<div id="view-users" style="display:none;padding:0 10px"><div class="card"><h3>👥 People — Blue Tick Verified ✔️</h3><div id="usersList"></div></div></div>

<!-- CHAT -->
<div id="view-chat" style="display:none;padding:0 10px"><div class="card"><h3>💬 Messenger — Real Time</h3><select id="chatTo"></select><button class="btn-blue" style="width:100%;margin-top:6px" onclick="loadChat()">Open Chat</button><div id="chatBox" class="chat-box" style="margin-top:10px"></div><div style="display:flex;gap:6px;margin-top:8px"><input id="chatMsg" placeholder="Message..."><button class="btn-blue" onclick="sendChat()">Send</button></div></div></div>

<!-- PROFILE -->
<div id="view-profile" style="display:none;padding:0 10px"><div class="card" style="text-align:center"><img id="profAv" class="avatar" style="width:100px;height:100px"><h2 id="profName"></h2><span class="verify">✔️ Verified Founder</span><div class="small" id="profStats"></div><textarea id="bio" placeholder="Bio..."></textarea><button class="btn-bty" style="width:100%;margin-top:8px" onclick="saveBio()">Save Bio</button></div><div id="myPosts"></div></div>

</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyA7JJpeSfV-pY-XCtsdXLvITFQmAvZ8pKo",authDomain:"yokelbook-global.firebaseapp.com",projectId:"yokelbook-global",storageBucket:"yokelbook-global.firebasestorage.app",messagingSenderId:"1048288092483",appId:"1:1048288092483:web:0f6eb6073dfc94b0d3cff6"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let user=localStorage.getItem('yb_user')||'',mode=localStorage.getItem('yb_mode')||'light',avatars=JSON.parse(localStorage.getItem('yb_av')||'{}'),bios=JSON.parse(localStorage.getItem('yb_bio')||'{}'),postImg='',postVid='',posting=false,currentChatTo='',allPosts=[],allUsers=[],notifs=JSON.parse(localStorage.getItem('yb_notif')||'[]'),liveStream=null;
document.body.className=mode;
function toggleMode(){mode=mode=='light'?'dark':'light';document.body.className=mode;localStorage.setItem('yb_mode',mode);}
function showTab(t){['feed','market','users','chat','profile'].forEach(x=>{document.getElementById('view-'+x).style.display=x==t?'block':'none';let tab=document.getElementById('tab-'+x);if(tab)tab.classList.toggle('active',x==t);});if(t=='profile')renderProfile();}
function toggleNotifs(){let p=document.getElementById('notifPanel');p.style.display=p.style.display=='block'?'none':'block';}
function pushNotif(txt){notifs.unshift({txt,time:new Date().toLocaleTimeString()});if(notifs.length>25)notifs.pop();localStorage.setItem('yb_notif',JSON.stringify(notifs));renderNotifs();}
function renderNotifs(){document.getElementById('notifList').innerHTML=notifs.map(n=>'<div style="padding:8px;border-bottom:1px solid #ddd"><b>'+n.txt+'</b><div class=small>'+n.time+'</div></div>').join('')||'<div class=small>No notifications — follow, like, chat!</div>';let c=document.getElementById('bellCount');c.innerText=notifs.length;c.style.display=notifs.length?'flex':'none';}
function clearNotifs(){notifs=[];localStorage.setItem('yb_notif',JSON.stringify(notifs));renderNotifs();}
function renderLogin(){document.getElementById('loginBox').innerHTML='<h2>YOKEL BTY V18 ULTIMATE 💎</h2><p class=small>Live + Market + Blue Tick + Video + Chat</p><input id=u placeholder="Nem blo yu"><button class=btn-bty style="width:100%;padding:14px;margin-top:10px" onclick="login()">Join ULTIMATE 🚀</button>';}
function login(){let v=document.getElementById('u').value.trim();if(!v)return;localStorage.setItem('yb_user',v);location.reload();}function logout(){localStorage.removeItem('yb_user');location.reload();}
async function goLive(){try{let stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});liveStream=stream;document.getElementById('liveVideo').srcObject=stream;document.getElementById('livePanel').style.display='block';document.getElementById('liveNow').style.display='inline';db.collection('live').doc('now').set({user,time:Date.now(),active:true});pushNotif('You are LIVE 🔴');}catch(e){alert('Camera permission needed!');}}
function stopLive(){if(liveStream)liveStream.getTracks().forEach(t=>t.stop());document.getElementById('livePanel').style.display='none';document.getElementById('liveNow').style.display='none';db.collection('live').doc('now').update({active:false});pushNotif('Live ended ✅');}
function compress(file,max,qual,cb){let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h*=max/w;w=max;}else{w*=max/h;h=max;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',qual));};img.src=e.target.result;};r.readAsDataURL(file);}
document.getElementById('avInput').addEventListener('change',e=>{if(!e.target.files[0])return;compress(e.target.files[0],200,0.4,d=>{avatars[user]=d;localStorage.setItem('yb_av',JSON.stringify(avatars));myAv.src=d;profAv.src=d;pushNotif('Avatar updated ✔️');});});
document.getElementById('postFile').addEventListener('change',e=>{if(!e.target.files[0])return;status.innerText='Compressing...';compress(e.target.files[0],700,0.55,d=>{postImg=d;preview.src=d;preview.style.display='block';previewVid.style.display='none';postVid='';status.innerText='Photo ready ✅';});});
document.getElementById('postVideo').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){alert('Video max 8MB — trim shorter!');return;}let r=new FileReader();r.onload=ev=>{postVid=ev.target.result;previewVid.src=postVid;previewVid.style.display='block';preview.style.display='none';postImg='';status.innerText='Video ready 🎥';};r.readAsDataURL(f);});
document.getElementById('storyFile').addEventListener('change',e=>{if(!e.target.files[0])return;compress(e.target.files[0],400,0.5,d=>{db.collection('stories').add({user,img:d,time:Date.now()});pushNotif('Story posted 🔥');});});
function clearPreview(){postImg='';postVid='';preview.style.display='none';previewVid.style.display='none';postFile.value='';postVideo.value='';price.value='';status.innerText='';}
async function makePost(){if(posting)return;let t=txt.value.trim();if(!t&&!postImg&&!postVid)return alert('Write something!');posting=true;postBtn.innerText='Posting...';await db.collection('posts').add({user,txt:t,img:postImg||'',video:postVid||'',price:document.getElementById('price').value||'',type:document.getElementById('postType').value,time:Date.now(),timeStr:new Date().toLocaleString(),likes:0,likedBy:[],comments:[]});txt.value='';clearPreview();posting=false;postBtn.innerText='Postim 🚀';pushNotif(type=='market'?'Market item listed 🛒':'Post LIVE 🌍');}
async function likePost(id,likedBy,likes,owner){let ref=db.collection('posts').doc(id);if((likedBy||[]).includes(user))await ref.update({likedBy:firebase.firestore.FieldValue.arrayRemove(user),likes:likes-1});else{await ref.update({likedBy:firebase.firestore.FieldValue.arrayUnion(user),likes:likes+1});if(owner!=user)pushNotif('Liked ❤️');}}
async function addComment(id){let inp=document.getElementById('c-'+id);let v=inp.value.trim();if(!v)return;await db.collection('posts').doc(id).update({comments:firebase.firestore.FieldValue.arrayUnion({user,text:v})});inp.value='';pushNotif('Comment 💬');}
async function delPost(id){if(confirm('Delete?'))await db.collection('posts').doc(id).delete();}
function sharePost(txt){if(navigator.share){navigator.share({title:'YOKEL BTY',text:txt,url:location.href});}else{navigator.clipboard.writeText(location.href);pushNotif('Link copied 📤');}}
async function followUser(t){await db.collection('follows').add({from:user,to:t,time:Date.now()});pushNotif('Followed '+t+' ✅');}
async function buyItem(u,txt,price){alert('Contact '+u+' to buy: '+txt+' for K'+price+'\n\nGo to Chat tab → Message '+u);pushNotif('Market inquiry 🛒');startChat(u);}
function loadUsersFromPosts(posts){let s=new Set();posts.forEach(p=>s.add(p.user));allUsers=Array.from(s);let sel=document.getElementById('chatTo');sel.innerHTML='<option>Select...</option>'+allUsers.filter(u=>u!=user).map(u=>'<option value="'+u+'">'+u+'</option>').join('');document.getElementById('usersList').innerHTML=allUsers.map(u=>{let av=avatars[u]||'';let bio=bios[u]||'';return '<div class=card style="display:flex;gap:10px;align-items:center"><img class=avatar src="'+av+'"><div style="flex:1"><b>'+u+'</b> <span class=verify>✔️</span> '+(u.includes('Yokel')?'<span class=badge>FOUNDER 👑</span>':'')+'<div class=small>'+bio+'</div></div><button class=btn-bty onclick="followUser(\''+u+'\')">Follow</button><button class=btn-blue onclick="startChat(\''+u+'\')">Chat</button></div>';}).join('');}
function startChat(u){showTab('chat');document.getElementById('chatTo').value=u;loadChat();}
let chatUnsub=null;
function loadChat(){let to=document.getElementById('chatTo').value;if(!to||to.includes('Select'))return;currentChatTo=to;if(chatUnsub)chatUnsub();let chatId=[user,to].sort().join('_');chatUnsub=db.collection('chats').doc(chatId).collection('messages').orderBy('time').onSnapshot(snap=>{let h='';snap.forEach(d=>{let m=d.data();h+='<div class="msg '+(m.from==user?'me':'other')+'"><b>'+m.from+':</b> '+m.text+'</div>';});document.getElementById('chatBox').innerHTML=h||'<div class=small>No messages — say Hi!</div>';document.getElementById('chatBox').scrollTop=99999;});}
async function sendChat(){let t=document.getElementById('chatMsg').value.trim();if(!t||!currentChatTo)return;let chatId=[user,currentChatTo].sort().join('_');await db.collection('chats').doc(chatId).collection('messages').add({from:user,to:currentChatTo,text:t,time:Date.now()});document.getElementById('chatMsg').value='';pushNotif('Message sent 💬');}
function saveBio(){let b=document.getElementById('bio').value.trim();bios[user]=b;localStorage.setItem('yb_bio',JSON.stringify(bios));pushNotif('Bio saved ✔️');}
function renderProfile(){profName.innerText=user;profAv.src=avatars[user]||'';bio.value=bios[user]||'';let my=allPosts.filter(p=>p.user==user);profStats.innerText=my.length+' posts • '+my.reduce((s,p)=>s+(p.likes||0),0)+' likes • Founder';myPosts.innerHTML=my.map(p=>'<div class=card><div class=small>'+p.timeStr+(p.price?' • K'+p.price:'')+'</div><p>'+(p.txt||'')+'</p>'+(p.img?'<img class=post-img src="'+p.img+'">':'')+(p.video?'<video class=post-vid controls src="'+p.video+'"></video>':'')+'</div>').join('');}
function listen(){db.collection('posts').orderBy('time','desc').onSnapshot(snap=>{let posts=[];snap.forEach(d=>posts.push({id:d.id,...d.data()}));allPosts=posts;online.innerText=posts.length+' posts • MARKET • LIVE • '+allUsers.length+' users';loadUsersFromPosts(posts);let html='',marketHtml='';posts.forEach(p=>{let av=avatars[p.user]||'';let lb=p.likedBy||[];let cm=p.comments||[];let card='<div class=card><div style="display:flex;gap:10px;align-items:center"><img class=avatar src="'+av+'"><div><b>'+p.user+'</b> <span class=verify>✔️</span> '+(p.user.includes('Yokel')?'<span class=badge>FOUNDER 👑</span>':'')+'<div class=small>'+(p.timeStr||'')+(p.price?' • <span class=price>K'+p.price+'</span>':'')+'</div></div><button class=btn-gray style="margin-left:auto" onclick="followUser(\''+p.user+'\')">Follow</button></div>'+(p.txt?'<p>'+p.txt+'</p>':'')+(p.img?'<img class=post-img src="'+p.img+'">':'')+(p.video?'<video class=post-vid controls src="'+p.video+'"></video>':'')+'<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class=btn-gray onclick="likePost(\''+p.id+'\','+JSON.stringify(lb).replace(/"/g,'&quot;')+','+(p.likes||0)+',\''+p.user+'\')">❤️ '+(p.likes||0)+'</button><button class=btn-gray>💬 '+cm.length+'</button><button class=btn-gray onclick="sharePost(\''+(p.txt||'').replace(/'/g,'')+'\')">📤</button>'+(p.type=='market'?'<button class=btn-green onclick="buyItem(\''+p.user+'\',\''+(p.txt||'').replace(/'/g,'')+'\',\''+(p.price||'0')+'\')">🛒 Buy K'+(p.price||'0')+'</button>':'')+'<button class=btn-blue onclick="startChat(\''+p.user+'\')">Chat</button>'+(p.user==user?'<button class=btn-red onclick="delPost(\''+p.id+'\')">Del</button>':'')+'</div><div style="margin-top:6px">'+cm.map(c=>'<div class=small><b>'+c.user+':</b> '+c.text+'</div>').join('')+'</div><div style="display:flex;gap:6px;margin-top:8px"><input id="c-'+p.id+'" placeholder=Comment><button class=btn-blue onclick="addComment(\''+p.id+'\')">Send</button></div></div>';html+=card;if(p.type=='market')marketHtml+=card;});feed.innerHTML=html||'<div class=card>Be first to post! 🚀</div>';marketFeed.innerHTML=marketHtml||'<div class=small>No market items yet — post with "Sell in Market"</div>';});db.collection('stories').orderBy('time','desc').limit(15).onSnapshot(snap=>{let h='<div class=story onclick="document.getElementById(\'storyFile\').click()"><div class=story-ring style="background:#ddd;display:flex;align-items:center;justify-content:center"><span style="font-size:28px">+</span></div><div class=small>Add</div></div>';snap.forEach(d=>{let s=d.data();let av=avatars[s.user]||'';h+='<div class=story><div class=story-ring><img src="'+(s.img||av)+'"></div><div class=small>'+s.user.slice(0,6)+'</div></div>';});document.getElementById('storiesBar').innerHTML=h;});db.collection('live').doc('now').onSnapshot(d=>{if(d.exists&&d.data().active&&d.data().user!=user){document.getElementById('liveNow').style.display='inline';document.getElementById('liveNow').innerText='🔴 '+d.data().user+' LIVE';}});}
if(!user)renderLogin();else{loginBox.style.display='none';app.style.display='block';hello.innerText=user;myAv.src=avatars[user]||'';listen();renderNotifs();if('Notification' in window)Notification.requestPermission();}
</script>
</body>
</html>
